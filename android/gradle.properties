# Capped deliberately: this builds on a shared server that also runs
# production containers, so Gradle must not be free to take the machine.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.daemon=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
